[project]
name = "lamaquina"
version = "0.1.0"
description = "Local code execution sandboxes for LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "restrictedpython>=8.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lamaquina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
